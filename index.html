<!DOCTYPE html>
<!-- Unit 6 Phrasal Verbs Hub (Grammar). Six practice games over 63 phrasal verbs with pictures (images/pv01.jpg ... pv63.jpg).
     Standalone HTML/CSS/JS for GitHub Pages; embeddable in LearnWorlds. Progress is kept in this browser only (localStorage). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phrasal Verbs | Grammar Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#123d70;--blue:#2563eb;--ink:#1e3a5f;--muted:#64748b;--ok:#15803d;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--line:#d8e5f4;--bg:#f4f7fb;--sel:#dbeafe;--amber:#b45309;--amberbg:#fef3c7}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Poppins,Arial,sans-serif;line-height:1.5}
.quiz-container{width:100%;max-width:100%;min-height:100vh}
.quiz-card{width:100%;max-width:1100px;margin:0 auto;background:#fff;min-height:100vh}
.quiz-header{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#eaf4ff;padding:10px 14px}
.header-teacher-img,.header-logo-img{height:64px;width:auto;max-width:none;object-fit:contain;flex:none}
@media (min-width:600px){.header-teacher-img,.header-logo-img{height:80px}}
@media (min-width:1024px){.header-teacher-img,.header-logo-img{height:96px}}
@media (max-width:640px){.header-teacher-img,.header-logo-img{height:45px}.quiz-header{padding:8px 12px}}
img[data-broken]{display:none}
.header-title{flex:1;min-width:0;text-align:center;line-height:1.2}
.title-line1{font-family:'Poppins',sans-serif;font-size:26px;font-weight:800;color:#1e3a5f}
.title-line2{font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;color:#2563eb}
.title-line3{font-family:'Poppins',sans-serif;font-size:14px;font-weight:400;color:#64748b}
@media (max-width:640px){.title-line1{font-size:16px}.title-line2{font-size:12px}.title-line3{font-size:10px}}
.info-bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:8px 14px}
.main{padding:14px}
.instruction{background:var(--navy);color:#fff;font-weight:700;border-radius:10px;padding:12px 14px;text-transform:uppercase;margin:0 0 12px}
.task{font-weight:700;text-align:center;margin:12px 0}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tiles.long{grid-template-columns:1fr}
.tile{font:inherit;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px;min-height:44px;cursor:pointer;color:var(--ink);overflow-wrap:anywhere}
.tile.correct{border-color:var(--ok);background:var(--okbg)}
.tile.wrong{border-color:var(--bad);background:var(--badbg)}
.tile:disabled{cursor:default;color:var(--ink)}
.feedback{margin-top:12px;padding:10px 12px;border-radius:10px}
.feedback.good{background:var(--okbg)}.feedback.badf{background:var(--badbg)}
.nav-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.fatal{margin:20px;padding:16px;background:var(--badbg);border-radius:10px;white-space:pre-wrap}
/* hub */
.hero{text-align:center;background:linear-gradient(135deg,#123d70,#2563eb);color:#fff;border-radius:14px;padding:18px 14px;margin:0 0 14px}
.hero h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.5px}
.hero p{margin:4px 0 0;opacity:.9}
@media (max-width:640px){.hero{padding:12px 10px}.hero h1{font-size:19px}.hero p{font-size:13px}}
.dash{border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
.dash h2,.section-title{font-size:16px;margin:0 0 8px}
.bar{height:14px;background:#e2e8f0;border-radius:999px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.st-new{background:#cbd5e1}.st-learning{background:#f59e0b}.st-practising{background:#3b82f6}.st-mastered{background:#16a34a}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.sets .btn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.modes{grid-template-columns:1fr}}
.mode{font:inherit;text-align:left;border:2px solid var(--line);border-radius:14px;background:#fff;padding:14px;cursor:pointer;color:var(--ink);min-height:44px}
.mode:hover{border-color:var(--blue);background:#f8fbff}
.mode b{display:block;font-size:16px}.mode small{color:var(--muted)}
.mode .best{display:block;font-size:12px;color:var(--navy);margin-top:4px;font-weight:600}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.warn{font-size:13px;background:var(--amberbg);color:var(--amber);border-radius:10px;padding:8px 10px;margin:0 0 12px}
details.verbs{border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:14px}
details.verbs summary{cursor:pointer;font-weight:700;min-height:32px}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 14px;margin-top:8px;font-size:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px;font-weight:600;font-size:14px}
.progress{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:0 0 12px}.progress span{display:block;height:100%;background:var(--blue)}
.pic{display:block;width:100%;max-width:520px;aspect-ratio:3/2;object-fit:cover;margin:0 auto 12px;border-radius:12px;border:1px solid var(--line);background:#eef3f9}
.big-verb{font-size:28px;font-weight:800;text-align:center;margin:8px 0 12px}
.sentence{font-size:18px;text-align:center;margin:8px 0 14px;font-weight:600}
.gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--blue);margin:0 3px}
.fill{color:var(--ok);font-weight:800;border-bottom:3px solid var(--ok)}
.meaning-hint{text-align:center;color:var(--muted);margin:0 0 10px}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin:6px 0 12px}
.word{display:flex;gap:4px}
.slot{font:inherit;width:34px;height:44px;border:2px solid var(--line);border-bottom:3px solid var(--navy);border-radius:8px;background:#fff;font-size:20px;font-weight:700;color:var(--ink);text-transform:lowercase;padding:0;cursor:pointer}
.slot.ok{border-color:var(--ok);background:var(--okbg)}.slot.no{border-color:var(--bad);background:var(--badbg)}
.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 10px}
.letter{font:inherit;width:44px;height:44px;border:2px solid var(--line);border-radius:10px;background:#f8fbff;font-size:20px;font-weight:700;color:var(--ink);cursor:pointer;padding:0}
.letter:disabled{opacity:.25;cursor:default}
@media (max-width:400px){.slot{width:28px;font-size:18px}}
.match{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px}
@media (max-width:640px){.match{grid-template-columns:1fr}}
.match .col{display:flex;flex-direction:column;gap:8px}
.match .tile.active{border-color:var(--blue);background:var(--sel)}
.match .tile.done{border-color:var(--ok);background:var(--okbg);opacity:.75}
.match .tile.flash{border-color:var(--bad);background:var(--badbg)}
.match .verbcol .tile{font-weight:700;text-align:center}
.memory{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:640px){.memory{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{font:inherit;position:relative;aspect-ratio:3/2;border:2px solid var(--line);border-radius:12px;background:linear-gradient(135deg,#123d70,#2563eb);color:#fff;cursor:pointer;padding:0;overflow:hidden;min-height:44px}
.card .back{font-size:26px;font-weight:800}
.card.up{background:#fff;color:var(--ink)}
.card.up img{width:100%;height:100%;object-fit:cover;display:block}
.card .vtext{display:flex;align-items:center;justify-content:center;height:100%;font-weight:800;font-size:17px;padding:4px;text-align:center}
.card.matched{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
.card:disabled{cursor:default}
.result{text-align:center}
.badge{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:150px;height:150px;border-radius:50%;background:var(--navy);color:#fff;font-size:30px;font-weight:800;margin:12px}
.badge small{font-size:14px;font-weight:600}
.remark{font-size:22px;font-weight:800;min-height:34px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.review-item{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0;text-align:left}
.review-item img{width:90px;aspect-ratio:3/2;object-fit:cover;border-radius:8px;flex:none}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px}
</style>
</head>

function clearTimers() { if (memTimer) { clearTimeout(memTimer); memTimer = null; } }
function startRound(mode, verbsOverride) {
  clearTimers();
  var list = verbsOverride || setVerbs(ui.set);
  if (!list.length) { home('There are no verbs to practise in “My weak verbs” yet. Choose another set.'); return; }
  var bl = (mode === 'mean' || mode === 'mem') ? boards(verbsOverride ? list.slice() : pickVerbs(list, list.length), verbsOverride ? list.length : ROUND, !!verbsOverride) : null;
  var vs = bl ? [].concat.apply([], bl) : verbsOverride ? verbsOverride.slice() : pickVerbs(list, ROUND);
  R = { mode: mode, verbs: vs, i: 0, items: [], results: [], moves: 0, retry: !!verbsOverride };
  if (bl) {
    R.boards = bl.map(function (b) { return { verbs: b, order: shuffle(b), cards: mode === 'mem' ? shuffle(b.map(function (v) { return { key: v.id + '-p', id: v.id, face: 'pic' }; }).concat(b.map(function (v) { return { key: v.id + '-v', id: v.id, face: 'verb' }; }))) : null, done: {}, wrong: {}, active: null, up: [] }; });
    R.b = 0;
  } else {
    var kinds = ['pic', 'mean', 'sent', 'spell'];
    R.items = vs.map(function (v, k) {
      var kind = mode === 'master' ? kinds[k % 4] : mode;
      var item = { id: v.id, kind: kind, answered: false, ok: null, picked: null };
      if (kind === 'pic' || kind === 'sent') item.choices = shuffle([v].concat(distractors(v, 'v'))).map(function (x) { return x.id; });
      if (kind === 'mean') item.choices = shuffle([v].concat(distractors(v, 'm'))).map(function (x) { return x.id; });
      if (kind === 'spell') { var letters = v.v.replace(/ /g, '').split(''); item.tiles = shuffle(letters.map(function (c, j) { return { c: c, k: j }; })); item.fill = []; }
      return item;
    });
    if (mode === 'master') R.items = shuffle(R.items);
  }
  render();
}

/* ---- rendering ---- */
function header(title, sub) { return '<div class="instruction">' + esc(title) + '</div>' + (sub ? '<p class="task">' + esc(sub) + '</p>' : ''); }
function render() {
  if (!R) return home();
  if (R.finished) return results();
  if (R.mode === 'mean') return renderMatch();
  if (R.mode === 'mem') return renderMemory();
  renderQuestion();
}
function topbar(done, total) {
  var name = MODES.filter(function (m) { return m.key === R.mode; })[0].name;
  return '<div class="topbar"><span>' + esc(name) + (R.retry ? ' · retry' : '') + '</span><span>' + done + ' / ' + total + '</span></div>' +
    '<div class="progress" aria-hidden="true"><span style="width:' + Math.round(done / total * 100) + '%"></span></div>';
}
function gapSentence(v, reveal) {
  return esc(v.ex).replace(/\{([^}]+)\}/g, function (m, w) { return reveal ? '<span class="fill">' + w + '</span>' : '<span class="gap" aria-label="gap">&nbsp;</span>'; });
}
function choiceLabel(kind, id) { var v = byId(id); return kind === 'mean' ? v.m : v.v; }
function renderQuestion() {
  var it = R.items[R.i], v = byId(it.id), h = topbar(R.i + (it.answered ? 1 : 0), R.items.length);
  if (it.kind === 'pic') h += header('Picture Detective', 'Which phrasal verb does the picture show?') + img(v);
  if (it.kind === 'mean') h += header('Match the meaning', 'What does this phrasal verb mean?') + '<div class="big-verb">' + esc(v.v) + '</div>';
  if (it.kind === 'sent') h += header('Complete the sentence', 'Choose the phrasal verb that completes the sentence.') + '<p class="sentence">' + gapSentence(v, it.answered) + '</p>';
  if (it.kind === 'spell') h += header('Spell it!', 'Tap the letters to spell the phrasal verb.') + img(v) + '<p class="meaning-hint">Meaning: ' + esc(v.m) + '</p>' + spellBody(it, v);
  if (it.choices) {
    h += '<div class="tiles' + (it.kind === 'mean' ? ' long' : '') + '" role="group" aria-label="Choices">' + it.choices.map(function (cid) {
      var cls = 'tile'; if (it.answered) { if (cid === it.id) cls += ' correct'; else if (cid === it.picked) cls += ' wrong'; }
      return '<button type="button" class="' + cls + '" data-act="choose" data-id="' + cid + '"' + (it.answered ? ' disabled' : '') + '>' + esc(choiceLabel(it.kind, cid)) + '</button>';
    }).join('') + '</div>';
  }
  if (it.answered) h += feedback(it, v);
  h += '<div class="nav-row"><button type="button" class="btn" data-act="quit">⌂ Home</button>' +
       '<button type="button" class="btn primary" data-act="next"' + (it.answered ? '' : ' disabled') + '>' + (R.i === R.items.length - 1 ? 'See results ▶' : 'Next ▶') + '</button></div>';
  app.innerHTML = h;
}
function img(v) { return '<img class="pic" src="' + v.img + '" alt="Picture clue" onerror="this.alt=\'(picture could not load)\'">'; }
function feedback(it, v) {
  return '<div class="feedback ' + (it.ok ? 'good' : 'badf') + '" role="status">' + (it.ok ? '✅ Correct! ' : '❌ Not quite. The answer is <b>' + esc(v.v) + '</b>. ') +
    '<b>' + esc(v.v) + '</b> = ' + esc(v.m) + '.<br><i>' + gapSentence(v, true) + '</i></div>';
}
function spellBody(it, v) {
  var words = v.v.split(' '), pos = 0, h = '<div class="slots" aria-label="Your answer">';
  words.forEach(function (w) {
    h += '<span class="word">';
    for (var j = 0; j < w.length; j++, pos++) {
      var f = it.fill[pos], cls = 'slot';
      if (it.answered) cls += (f && f.c === v.v.replace(/ /g, '')[pos]) ? ' ok' : ' no';
      h += '<button type="button" class="' + cls + '" data-act="unslot" data-pos="' + pos + '"' + (it.answered || !f ? ' disabled' : '') + ' aria-label="letter ' + (pos + 1) + '">' + (f ? esc(f.c) : '') + '</button>';
    }
    h += '</span>';
  });
  h += '</div>';
  if (!it.answered) {
    var used = it.fill.map(function (f) { return f && f.k; });
    h += '<div class="letters">' + it.tiles.map(function (t) { return '<button type="button" class="letter" data-act="tile" data-k="' + t.k + '"' + (used.indexOf(t.k) > -1 ? ' disabled' : '') + '>' + esc(t.c) + '</button>'; }).join('') + '</div>';
    var full = it.fill.filter(Boolean).length === v.v.replace(/ /g, '').length;
    h += '<div class="actions"><button type="button" class="btn" data-act="clear">Clear</button><button type="button" class="btn primary" data-act="checkspell"' + (full ? '' : ' disabled') + '>Check</button></div>';
  }
  return h;
}
function renderMatch() {
  var B = R.boards[R.b], doneN = R.boards.slice(0, R.b).reduce(function (a, b) { return a + b.verbs.length; }, 0) + Object.keys(B.done).length;
  var h = topbar(doneN, R.verbs.length) + header('Match the Meaning', 'Tap a phrasal verb, then tap its meaning.');
  h += '<div class="match"><div class="col verbcol" role="group" aria-label="Phrasal verbs">' + B.verbs.map(function (v) {
    var cls = 'tile' + (B.done[v.id] ? ' done' : '') + (B.active === v.id ? ' active' : '');
    return '<button type="button" class="' + cls + '" data-act="mverb" data-id="' + v.id + '" aria-pressed="' + (B.active === v.id) + '"' + (B.done[v.id] ? ' disabled' : '') + '>' + esc(v.v) + '</button>';
  }).join('') + '</div><div class="col" role="group" aria-label="Meanings">' + B.order.map(function (v) {
    var cls = 'tile' + (B.done[v.id] ? ' done' : '') + (B.flash === v.id ? ' flash' : '');
    return '<button type="button" class="' + cls + '" data-act="mmean" data-id="' + v.id + '"' + (B.done[v.id] || !B.active ? ' disabled' : '') + '>' + esc(v.m) + '</button>';
  }).join('') + '</div></div>';
  var all = Object.keys(B.done).length === B.verbs.length;
  h += '<div class="nav-row"><button type="button" class="btn" data-act="quit">⌂ Home</button><button type="button" class="btn primary" data-act="nextboard"' + (all ? '' : ' disabled') + '>' + (R.b === R.boards.length - 1 ? 'See results ▶' : 'Next board ▶') + '</button></div>';
  app.innerHTML = h;
}
function renderMemory() {
  var B = R.boards[R.b], doneN = R.boards.slice(0, R.b).reduce(function (a, b) { return a + b.verbs.length; }, 0) + Object.keys(B.done).length;
  var h = topbar(doneN, R.verbs.length) + header('Memory Match', 'Turn two cards: find each picture and its phrasal verb.') + '<p class="meaning-hint">Moves: <b id="moves">' + R.moves + '</b></p>';
  h += '<div class="memory">' + B.cards.map(function (c, k) {
    var up = B.done[c.id] || B.up.indexOf(k) > -1, v = byId(c.id);
    var inner = !up ? '<span class="back" aria-hidden="true">?</span>' : (c.face === 'pic' ? '<img src="' + v.img + '" alt="Picture card">' : '<span class="vtext">' + esc(v.v) + '</span>');
    return '<button type="button" class="card' + (up ? ' up' : '') + (B.done[c.id] ? ' matched' : '') + '" data-act="flip" data-k="' + k + '" aria-label="' + (up ? (c.face === 'pic' ? 'picture card' : esc(v.v)) : 'card ' + (k + 1) + ', face down') + '"' + (B.done[c.id] ? ' disabled' : '') + '>' + inner + '</button>';
  }).join('') + '</div>';
  var all = Object.keys(B.done).length === B.verbs.length;
  h += '<div class="nav-row"><button type="button" class="btn" data-act="quit">⌂ Home</button><button type="button" class="btn primary" data-act="nextboard"' + (all ? '' : ' disabled') + '>' + (R.b === R.boards.length - 1 ? 'See results ▶' : 'Next board ▶') + '</button></div>';
  app.innerHTML = h;
}

/* ---- actions ---- */
function answer(it, ok, picked) {
  if (it.answered) return; /* lock once */
  it.answered = true; it.ok = ok; it.picked = picked; record(it.id, it.kind, ok);
  say(ok ? 'Correct.' : 'Not correct. The answer is ' + byId(it.id).v + '.');
}
function finish() {
  clearTimers();
  if (R.mode === 'mean' || R.mode === 'mem') {
    R.results = R.verbs.map(function (v) { var B = R.boards.filter(function (b) { return b.verbs.indexOf(v) > -1; })[0]; return { id: v.id, ok: R.mode === 'mem' ? true : !B.wrong[v.id] }; });
  } else R.results = R.items.map(function (it) { return { id: it.id, ok: it.ok }; });
  R.score = R.results.filter(function (r) { return r.ok; }).length;
  if (!R.retry) {
    var b = store.best[R.mode];
    if (R.mode === 'mem') { if (!b || R.moves < b.moves) store.best.mem = { moves: R.moves, of: R.verbs.length }; }
    else if (!b || R.score / R.results.length > b.score / b.of) store.best[R.mode] = { score: R.score, of: R.results.length };
    store.rounds = (store.rounds || 0) + 1; save();
  }
  R.finished = true; render(); window.scrollTo(0, 0);
}
function onClick(e) {
  var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  var act = el.getAttribute('data-act');
  if (act === 'set') { ui.set = el.getAttribute('data-set'); return home(); }
  if (act === 'mode') return startRound(el.getAttribute('data-mode'));
  if (act === 'quit' || act === 'home') { clearTimers(); R = null; home(); window.scrollTo(0, 0); return; }
  if (act === 'again') return startRound(R.mode);
  if (act === 'retry') { var miss = R.results.filter(function (r) { return !r.ok; }).map(function (r) { return byId(r.id); }); return startRound(R.mode, miss); }
  if (act === 'reset') { if (window.confirm('Delete all your progress on this device?')) { store = { verbs: {}, best: {}, rounds: 0 }; save(); home(); } return; }
  if (!R) return;
  var it = R.items && R.items[R.i];
  if (act === 'choose') { answer(it, el.getAttribute('data-id') === it.id, el.getAttribute('data-id')); return render(); }
  if (act === 'tile') { var k = +el.getAttribute('data-k'), t = it.tiles.filter(function (x) { return x.k === k; })[0], pos = firstEmpty(it); if (pos > -1) it.fill[pos] = t; return render(); }
  if (act === 'unslot') { it.fill[+el.getAttribute('data-pos')] = null; return render(); }
  if (act === 'clear') { it.fill = []; return render(); }
  if (act === 'checkspell') { var v = byId(it.id), typed = it.fill.map(function (f) { return f ? f.c : ''; }).join(''); answer(it, typed === v.v.replace(/ /g, ''), typed); return render(); }
  if (act === 'next') { if (!it.answered) return; if (R.i < R.items.length - 1) { R.i++; render(); window.scrollTo(0, 0); } else finish(); return; }
  var B = R.boards && R.boards[R.b];
  if (act === 'mverb') { B.active = el.getAttribute('data-id'); B.flash = null; return render(); }
  if (act === 'mmean') {
    var id = el.getAttribute('data-id');
    if (!B.active) return;
    if (id === B.active) { B.done[id] = true; record(id, 'mean', !B.wrong[id]); B.active = null; B.flash = null; say('Matched.'); }
    else { B.wrong[B.active] = true; B.flash = id; say('Not a match. Try again.'); }
    return render();
  }
  if (act === 'flip') {
    var k2 = +el.getAttribute('data-k');
    if (B.up.length === 2) { clearTimers(); B.up = []; }
    if (B.up.indexOf(k2) > -1) return;
    B.up.push(k2);
    if (B.up.length === 2) {
      R.moves++;
      var c1 = B.cards[B.up[0]], c2 = B.cards[B.up[1]];
      if (c1.id === c2.id) { B.done[c1.id] = true; B.up = []; say('Pair found: ' + byId(c1.id).v + '.'); }
      else { say('Not a pair.'); memTimer = setTimeout(function () { memTimer = null; if (R && R.boards && R.boards[R.b] === B) { B.up = []; render(); } }, 1100); }
    }
    return render();
  }
  if (act === 'nextboard') { if (Object.keys(B.done).length !== B.verbs.length) return; clearTimers(); if (R.b < R.boards.length - 1) { R.b++; render(); window.scrollTo(0, 0); } else finish(); return; }
}
function firstEmpty(it) { var n = byId(it.id).v.replace(/ /g, '').length; for (var p = 0; p < n; p++) if (!it.fill[p]) return p; return -1; }
/* keyboard for Spell It!: letters place a tile, Backspace removes the last one */
function onKey(e) {
  if (!R || R.finished || !R.items || !R.items[R.i] || R.items[R.i].kind !== 'spell' || R.items[R.i].answered) return;
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  var it = R.items[R.i];
  if (/^[a-z]$/i.test(e.key)) {
    var used = it.fill.map(function (f) { return f && f.k; }), t = it.tiles.filter(function (x) { return x.c === e.key.toLowerCase() && used.indexOf(x.k) < 0; })[0], pos = firstEmpty(it);
    if (t && pos > -1) { it.fill[pos] = t; render(); }
  } else if (e.key === 'Backspace') {
    for (var p = it.fill.length - 1; p >= 0; p--) if (it.fill[p]) { it.fill[p] = null; break; }
    e.preventDefault(); render();
  } else if (e.key === 'Enter') { var btn = $('[data-act="checkspell"]'); if (btn && !btn.disabled) btn.click(); }
}

/* ---- home / dashboard ---- */
function home(msg) {
  R = null;
  var counts = { 'new': 0, learning: 0, practising: 0, mastered: 0 };
  VERBS.forEach(function (v) { counts[status(v.id)]++; });
  var seg = function (k) { return '<span class="st-' + k + '" style="width:' + (counts[k] / VERBS.length * 100) + '%"></span>'; };
  var h = '<div class="hero"><h1>PHRASAL VERBS MASTER CHALLENGE</h1><p>Learn it. Remember it. Use it. · 63 verbs · 63 pictures · 6 games</p></div>';
  if (!storeOk) h += '<p class="warn">Your progress cannot be saved in this browser (storage is blocked). You can still play; progress is kept until you close the page.</p>';
  if (msg) h += '<p class="warn" role="status">' + esc(msg) + '</p>';
  h += '<section class="dash" aria-label="Your progress"><h2>Overall mastery: <span id="masteredN">' + counts.mastered + '</span> / 63</h2>' +
    '<div class="bar" role="img" aria-label="' + counts.mastered + ' mastered, ' + counts.practising + ' practising, ' + counts.learning + ' learning, ' + counts['new'] + ' new">' + seg('mastered') + seg('practising') + seg('learning') + '</div>' +
    '<div class="legend">' + ['mastered', 'practising', 'learning', 'new'].map(function (k) { return '<span><span class="dot st-' + k + '"></span>' + STATUS_LABEL[k] + ': <b data-count="' + k + '">' + counts[k] + '</b></span>'; }).join('') + '</div>' +
    '<p class="note">Mastered = answered correctly in at least 3 different games, including Spell It! or Complete the Sentence, and right the last time. Memory Match is for fun and does not change mastery. Progress is saved on this device only.</p></section>';
  h += '<p class="section-title"><b>1. Choose your verbs</b></p><div class="sets" role="group" aria-label="Verb sets">' + SETS.map(function (s) {
    var n = setVerbs(s.key).length;
    return '<button type="button" class="btn" data-act="set" data-set="' + s.key + '" aria-pressed="' + (ui.set === s.key) + '">' + esc(s.label) + (s.key === 'weak' ? ' (' + n + ')' : '') + '</button>';
  }).join('') + '</div>';
  h += '<p class="section-title"><b>2. Choose a game</b> <span class="note">(10 verbs per round)</span></p><div class="modes">' + MODES.map(function (m) {
    var b = store.best[m.key], best = !b ? 'Not played yet' : m.key === 'mem' ? 'Best: ' + b.moves + ' moves' : 'Best: ' + b.score + ' / ' + b.of;
    return '<button type="button" class="mode" data-act="mode" data-mode="' + m.key + '"><b>' + esc(m.name) + '</b><small>' + esc(m.sub) + '</small><span class="best">' + best + '</span></button>';
  }).join('') + '</div>';
  h += '<details class="verbs"><summary>See all 63 phrasal verbs and your level</summary><div class="vlist">' + VERBS.map(function (v) {
    var s = status(v.id); return '<span><span class="dot st-' + s + '" title="' + STATUS_LABEL[s] + '"></span><b>' + esc(label(v)) + '</b>: ' + esc(v.m) + ' <span class="sr-only">(' + STATUS_LABEL[s] + ')</span></span>';
  }).join('') + '</div></details>';
  h += '<div class="actions"><button type="button" class="btn" data-act="reset">Reset my progress</button></div>';
  app.innerHTML = h;
}
function results() {
  var n = R.results.length, pct = Math.round(R.score / n * 100);
  var remark = R.mode === 'mem' ? 'All pairs found!' : pct === 100 ? 'Perfect round!' : pct >= 80 ? 'Very good!' : pct >= 50 ? 'Good effort, keep practising!' : 'Keep going: try your mistakes again.';
  var h = '<div class="result">' + header('Round complete') + '<div class="badge">' + (R.mode === 'mem' ? R.moves + '<small>moves</small>' : R.score + ' / ' + n + '<small>' + pct + '%</small>') + '</div><div class="remark" id="remark">' + remark + '</div>';
  var miss = R.results.filter(function (r) { return !r.ok; });
  if (R.mode === 'mem') h += '<p>You found ' + n + ' pairs in ' + R.moves + ' moves (' + n + ' is the minimum).</p>';
  else if (miss.length) h += '<h3>Review your mistakes</h3>' + miss.map(function (r) { var v = byId(r.id); return '<div class="review-item"><img src="' + v.img + '" alt=""><div><b>' + esc(v.v) + '</b>: ' + esc(v.m) + '<br><i>' + gapSentence(v, true) + '</i></div></div>'; }).join('');
  h += '<div class="actions">' + (miss.length && R.mode !== 'mem' ? '<button type="button" class="btn primary" data-act="retry">Retry my mistakes (' + miss.length + ')</button>' : '') +
    '<button type="button" class="btn' + (miss.length && R.mode !== 'mem' ? '' : ' primary') + '" data-act="again">Play a new round</button><button type="button" class="btn" data-act="home">⌂ Home</button></div></div>';
  app.innerHTML = h;
}

/* ---- init (once) ---- */
if (window.__hubInit) return; window.__hubInit = true;
[['teacherImg', TEACHER_IMG], ['logoImg', LOGO_IMG]].forEach(function (p) { var im = document.getElementById(p[0]); im.onerror = function () { im.setAttribute('data-broken', ''); }; im.src = p[1]; });
var errs = validate();
if (errs.length) { app.innerHTML = '<div class="fatal" role="alert">This activity could not start:\n' + esc(errs.join('\n')) + '</div>'; return; }
app.addEventListener('click', onClick);
document.addEventListener('keydown', onKey);
home();
window.__hub = { get R() { return R; }, store: function () { return store; }, status: status, clash: clash, VERBS: VERBS, byId: byId, startRound: startRound, home: home, setSet: function (k) { ui.set = k; } };
})();
</script>
</body>
